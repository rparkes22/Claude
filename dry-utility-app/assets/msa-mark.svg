<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="MSA Consulting">
  <!--
    Vector stand-in for the MSA circular monogram on the letterhead: a faceted
    orange "M/S" on a charcoal disc. Drop the official artwork in at this path
    (same filename) and the nav, login screen, letters and reports all pick it up.
  -->
  <defs>
    <linearGradient id="msaHot" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fbb04a"/>
      <stop offset="0.5" stop-color="#ef7f20"/>
      <stop offset="1" stop-color="#b8480d"/>
    </linearGradient>
    <linearGradient id="msaDeep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7d3209"/>
      <stop offset="0.6" stop-color="#d9691a"/>
      <stop offset="1" stop-color="#f59b3c"/>
    </linearGradient>
    <radialGradient id="msaDisc" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#434346"/>
      <stop offset="0.55" stop-color="#1e1e21"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="99" fill="#0b0b0d"/>
  <circle cx="100" cy="100" r="93" fill="url(#msaDisc)"/>

  <!-- M on the left, drawn as flat facets -->
  <g>
    <path d="M38 150 V54 H58 L78 96 L70 118 L56 88 V150 Z" fill="url(#msaHot)"/>
    <path d="M38 150 V54 H58 L64 68 L56 84 V150 Z" fill="#ffc06b" opacity="0.20"/>
    <path d="M78 96 L98 54 H118 V150 H100 V88 L86 118 Z" fill="url(#msaDeep)"/>
    <path d="M98 54 H118 V150 H110 V66 Z" fill="#ffc06b" opacity="0.16"/>
  </g>

  <!-- S interlocking off the M's right shoulder -->
  <path d="M124 56 H166 V74 H140 Q131 74 131 82 Q131 89 142 92 L154 96
           Q168 101 168 118 Q168 140 150 140 H110 V122 H146 Q155 122 155 114
           Q155 107 144 104 L131 100 Q116 95 116 77 Q116 56 124 56 Z"
        fill="url(#msaHot)"/>
  <path d="M124 56 H166 V74 H140 Q131 74 131 82 L116 82 Q116 56 124 56 Z" fill="#ffc06b" opacity="0.20"/>

  <circle cx="100" cy="100" r="96" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="7"/>
</svg>
