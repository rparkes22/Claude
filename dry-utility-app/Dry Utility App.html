<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MSA — Dry Utility</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --surface-2: #f5f5f4; --surface-3: #ececea;
    --border: #e7e5e4; --border-strong: #d6d3d1;
    --ink: #1c1917; --ink-2: #44403c; --ink-3: #78716c; --ink-4: #a8a29e;
    --primary: #1d4e89; --primary-hover: #173f6e; --primary-tint: #e8eef5;
    --ok: #15803d; --ok-tint: #dcfce7; --ok-ink: #14532d;
    --warn: #b91c1c; --warn-tint: #fee2e2; --warn-ink: #7f1d1d;
    --amber: #b45309; --amber-tint: #fef3c7; --amber-ink: #78350f;
    --blue: #1e40af; --blue-tint: #dbeafe; --blue-ink: #1e3a8a;
    --violet: #6d28d9; --violet-tint: #ede9fe;
    --teal: #0f766e; --teal-tint: #ccfbf1;
    --gray-tint: #f4f4f5;
    --hl: #fff3bf; --hl-edge: #f3d77a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 6px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  a { color: var(--primary); } a:hover { color: var(--primary-hover); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; height: 32px; border-radius: 6px; border: 1px solid var(--border-strong); background: white; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; transition: all 0.1s; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-4); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-warn { background: var(--warn); border-color: var(--warn); color: white; }
  .btn-icon { width: 32px; padding: 0; justify-content: center; }
  .btn svg { width: 14px; height: 14px; }
  .btn-sm { height: 28px; font-size: 12px; padding: 0 10px; }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
  .btn-lg { height: 40px; font-size: 14px; padding: 0 18px; border-radius: 8px; }

  .avatar { border-radius: 50%; color: white; display: grid; place-items: center; font-weight: 600; flex-shrink: 0; }

  /* ===== LOGIN ===== */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #fafaf9 0%, #eef1f5 100%); padding: 24px; }
  .login-card { width: 400px; max-width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 34px 34px 28px; }
  .login-brand { display: flex; align-items: center; gap: 13px; margin-bottom: 26px; }
  .login-mark { width: 44px; height: 44px; background: var(--ink); color: white; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 20px; }
  .login-name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .login-tag { font-size: 12px; color: var(--ink-3); }
  .login-h { font-size: 15px; font-weight: 600; margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .input, .select { width: 100%; height: 38px; border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 12px; font: inherit; font-size: 13.5px; color: var(--ink); outline: none; background: white; }
  .input:focus, .select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
  .select { -webkit-appearance: none; appearance: none; padding-right: 30px; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%2378716c' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center; }
  .login-err { background: var(--warn-tint); color: var(--warn-ink); border-radius: 8px; padding: 9px 13px; font-size: 12.5px; margin-bottom: 14px; }
  .login-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 14px; color: var(--ink-4); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .demo-users { display: flex; flex-direction: column; gap: 7px; }
  .demo-user { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); cursor: pointer; font-family: inherit; text-align: left; transition: all 0.1s; }
  .demo-user:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .demo-user .du-name { font-size: 13px; font-weight: 600; }
  .demo-user .du-role { font-size: 11px; color: var(--ink-3); }
  .demo-user .du-go { margin-left: auto; color: var(--ink-4); }

  .role-badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 100px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .role-admin { background: var(--violet-tint); color: var(--violet); }
  .role-editor { background: var(--blue-tint); color: var(--blue-ink); }
  .role-viewer { background: var(--gray-tint); color: var(--ink-3); }

  /* ===== APP SHELL ===== */
  .shell { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
  .sidenav { background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; }
  .sn-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .sn-mark { width: 30px; height: 30px; background: var(--ink); color: white; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .sn-name { font-weight: 700; font-size: 14px; line-height: 1.1; }
  .sn-sub { font-size: 10.5px; color: var(--ink-3); }
  .sn-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; border: 0; background: none; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; text-align: left; width: 100%; }
  .sn-item svg { width: 15px; height: 15px; color: var(--ink-3); flex-shrink: 0; }
  .sn-item:hover { background: var(--surface-2); }
  .sn-item.active { background: var(--primary-tint); color: var(--primary); font-weight: 600; }
  .sn-item.active svg { color: var(--primary); }
  .sn-item .sn-count { margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--ink-4); background: var(--surface-3); padding: 0 6px; border-radius: 100px; }
  .sn-item.active .sn-count { background: white; color: var(--primary); }
  .sn-sec { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-4); font-weight: 700; padding: 14px 10px 5px; }
  .sn-foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px; }
  .sn-user { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
  .sn-user .u-name { font-size: 12.5px; font-weight: 600; line-height: 1.2; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 54px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 0 22px; position: sticky; top: 0; z-index: 30; }
  .topbar h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .topbar-spacer { flex: 1; }
  .content { padding: 20px 22px 70px; }

  .readonly-note { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--amber-ink); background: var(--amber-tint); padding: 4px 11px; border-radius: 100px; font-weight: 600; }

  /* badges & chips (shared) */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
  .b-ok { background: var(--ok-tint); color: var(--ok-ink); } .b-ok .badge-dot { background: var(--ok); }
  .b-amber { background: var(--amber-tint); color: var(--amber-ink); } .b-amber .badge-dot { background: var(--amber); }
  .b-warn { background: var(--warn-tint); color: var(--warn-ink); } .b-warn .badge-dot { background: var(--warn); }
  .b-blue { background: var(--blue-tint); color: var(--blue-ink); } .b-blue .badge-dot { background: var(--blue); }
  .b-violet { background: var(--violet-tint); color: var(--violet); } .b-violet .badge-dot { background: var(--violet); }
  .b-gray { background: var(--gray-tint); color: var(--ink-3); } .b-gray .badge-dot { background: var(--ink-4); }
  .b-teal { background: var(--teal-tint); color: var(--teal); } .b-teal .badge-dot { background: var(--teal); }
  .util-tag { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
  .util-iid { background: var(--primary-tint); color: var(--primary); }
  .util-sce { background: var(--blue-tint); color: var(--blue-ink); }
  .days-chip { font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 12.5px; }
  .days-chip.crit { color: var(--warn); } .days-chip.warn { color: var(--amber); } .days-chip.ok { color: var(--ink-2); } .days-chip.muted { color: var(--ink-4); }

  /* KPI strip */
  .kpis { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 16px; display: flex; align-items: center; gap: 12px; font-family: inherit; text-align: left; }
  .kpi.clickable { cursor: pointer; transition: all 0.1s; }
  .kpi.clickable:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .kpi.kpi-active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .kpi .k-ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; }
  .kpi .k-ic svg { width: 16px; height: 16px; }
  .kpi .k-val { font-size: 19px; font-weight: 600; font-family: 'Geist Mono', monospace; letter-spacing: -0.02em; line-height: 1; }
  .kpi .k-lab { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

  /* toolbar + lens */
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .lens { display: inline-flex; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--border); }
  .lens button { padding: 6px 13px; font-size: 12.5px; font-weight: 500; color: var(--ink-3); border-radius: 5px; cursor: pointer; border: 0; background: none; font-family: inherit; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .lens button:hover { color: var(--ink); }
  .lens button.active { background: white; color: var(--ink); box-shadow: var(--shadow-sm); }
  .lens button svg { width: 14px; height: 14px; }
  .toolbar-spacer { flex: 1; }
  .search-box { height: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; display: flex; align-items: center; padding: 0 10px; gap: 8px; color: var(--ink-3); min-width: 210px; }
  .search-box svg { width: 14px; height: 14px; flex-shrink: 0; }
  .search-box input { flex: 1; border: 0; background: transparent; outline: none; font: inherit; font-size: 13px; color: var(--ink); }
  .toggle-pill { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 7px; background: white; font-size: 12.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
  .toggle-pill .sw { width: 26px; height: 15px; border-radius: 100px; background: var(--border-strong); position: relative; transition: background 0.15s; }
  .toggle-pill .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: white; transition: transform 0.15s; }
  .toggle-pill.on { background: var(--primary-tint); border-color: var(--primary); color: var(--primary); }
  .toggle-pill.on .sw { background: var(--primary); }
  .toggle-pill.on .sw::after { transform: translateX(11px); }

  /* table */
  .grid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .grid-scroll { overflow-x: auto; }
  table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  table.grid th, table.grid td { padding: 0; text-align: left; white-space: nowrap; }
  table.grid thead th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-3); background: var(--surface-2); border-bottom: 1px solid var(--border); padding: 9px 14px; position: sticky; top: 0; z-index: 5; }
  table.grid td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--ink-2); vertical-align: middle; }
  table.grid tbody tr.row-main { cursor: pointer; transition: background 0.08s; }
  table.grid tbody tr.row-main:hover { background: var(--surface-2); }
  table.grid tbody tr.row-main.expanded { background: var(--primary-tint); }
  .col-project { position: sticky; left: 0; z-index: 4; background: var(--surface); box-shadow: 1px 0 0 var(--border); min-width: 235px; max-width: 235px; }
  thead .col-project { z-index: 6; background: var(--surface-2); }
  tr.row-main:hover .col-project { background: var(--surface-2); }
  tr.row-main.expanded .col-project { background: var(--primary-tint); }
  .proj-cell { display: flex; align-items: center; gap: 10px; }
  .proj-expand { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; color: var(--ink-4); flex-shrink: 0; transition: transform 0.15s; }
  tr.row-main.expanded .proj-expand { transform: rotate(90deg); color: var(--primary); }
  .proj-info { min-width: 0; }
  .proj-name { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 175px; }
  .proj-code { font-size: 11px; color: var(--ink-3); font-family: 'Geist Mono', monospace; }
  tr.group-row td { background: var(--surface-2); border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); padding: 8px 14px; position: sticky; left: 0; }
  .group-label { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 12px; color: var(--ink); }
  .group-count { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-3); background: var(--surface-3); padding: 1px 7px; border-radius: 100px; }

  .sub-dots { display: inline-flex; gap: 3px; }
  .sub-dot { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 9px; }
  .sub-dot svg { width: 9px; height: 9px; }
  .sd-ok { background: var(--ok-tint); color: var(--ok); }
  .sd-review { background: var(--amber-tint); color: var(--amber); }
  .sd-resubmit { background: var(--warn-tint); color: var(--warn); }
  .sd-none { background: var(--surface-3); color: var(--ink-4); }
  .dd-pips { display: inline-flex; gap: 3px; }
  .dd-pip { width: 8px; height: 8px; border-radius: 50%; }
  .dd-done { background: var(--ok); } .dd-prog { background: var(--amber); } .dd-todo { background: var(--surface-3); } .dd-na { background: var(--ink-4); opacity: 0.3; }
  .cell-muted { color: var(--ink-4); }
  .mini-pct { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-3); }

  /* expansion detail */
  tr.detail-row > td { padding: 0; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; left: 0; }
  .detail-panel { display: grid; grid-template-columns: 195px 1fr; }
  .detail-side { border-right: 1px solid var(--border); padding: 16px; background: var(--surface); }
  .detail-side h5 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .detail-side .ds-code { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--ink-3); margin-bottom: 10px; }
  .detail-side .ds-loc { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; margin-bottom: 10px; }
  .detail-tabs { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .detail-tab { text-align: left; padding: 7px 10px; border-radius: 6px; border: 0; background: none; font-family: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink-3); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .detail-tab:hover { background: var(--surface-2); color: var(--ink); }
  .detail-tab.active { background: var(--primary-tint); color: var(--primary); }
  .detail-tab .dt-count { font-family: 'Geist Mono', monospace; font-size: 10px; padding: 0 6px; border-radius: 100px; background: var(--surface-3); color: var(--ink-3); }
  .detail-tab.active .dt-count { background: white; color: var(--primary); }
  .detail-main { padding: 18px 20px; min-width: 0; }
  .detail-main h6 { margin: 0 0 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; }
  .sub-table { width: 100%; border-collapse: collapse; font-size: 12.5px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .sub-table th { background: var(--surface-2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); padding: 8px 12px; text-align: left; font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .sub-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--ink-2); vertical-align: middle; }
  .sub-table tr:last-child td { border-bottom: 0; }
  .dd-list { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .dd-item { background: var(--surface); padding: 11px 14px; display: flex; align-items: center; gap: 11px; }
  .dd-check { width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; display: grid; place-items: center; }
  .dd-check svg { width: 11px; height: 11px; }
  .dd-c-done { background: var(--ok); color: white; }
  .dd-c-prog { background: var(--amber-tint); color: var(--amber); border: 1.5px solid var(--amber); }
  .dd-c-todo { background: var(--surface-2); border: 1.5px solid var(--border-strong); }
  .dd-c-na { background: var(--surface-2); color: var(--ink-4); }
  .dd-name { font-size: 12.5px; font-weight: 500; color: var(--ink); }
  .dd-meta { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
  .dd-item.na .dd-name { color: var(--ink-4); text-decoration: line-through; }

  /* WSL page */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-hd { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel-hd h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .panel-hd .meta { font-size: 12px; color: var(--ink-3); }
  .wsl-strip { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; }
  .wsl-box { flex: 1; min-width: 150px; border: 1px solid var(--border); border-radius: 9px; padding: 13px 15px; background: var(--surface); }
  .wsl-box .wb-lab { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
  .wsl-box .wb-val { font-size: 16px; font-weight: 600; margin-top: 5px; font-family: 'Geist Mono', monospace; }
  .wsl-box .wb-sub { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
  .wsl-bar { height: 8px; border-radius: 100px; background: var(--surface-3); position: relative; overflow: visible; margin-top: 14px; }
  .wsl-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 100px; }
  .wsl-bar-today { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 2px; }
  .callout { border-radius: 9px; padding: 13px 15px; font-size: 12.5px; line-height: 1.5; display: flex; gap: 10px; }
  .callout.warn { background: var(--amber-tint); color: var(--amber-ink); }
  .callout.crit { background: var(--warn-tint); color: var(--warn-ink); }
  .callout.info { background: var(--primary-tint); color: var(--primary); }
  .callout svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
  .callout b { font-weight: 700; }

  /* USERS page */
  .invite-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .invite-grid { grid-template-columns: 1fr; } }
